<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self-Care Simplified</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
    <header>
        <a href="index.html"><h1>Self-Care Simplified</h1></a>
    </header>

    <main>
        <section>
            <h2>Energy Check-In</h2>
            <p>Select your energy level so we can give you a self-care suggestion that feels manageable today.</p>
        </section>

        <section class="card">
            <label for="energySelect" class="sr-only">Choose your energy level</label>
            <select id="energySelect">
                <option value="">How much energy do you have today?</option>
                <option value="none">None</option>
                <option value="low">Low</option>
                <option value="moderate">Moderate</option>
                <option value="high">High</option>
            </select>

            <button id="energySubmitBtn">Get Suggestion</button>
        </section>

        <nav>
            <a href="index.html">Home</a>
            <a href="resources.html">Resources</a>
        </nav>
    </main>

    <footer>
        <p>© 2026</p>
        <p>This application is intended as a self-care support tool and is not a substitute for professional mental health care.</p>
    </footer>
    
    <script src="js/energy.js"></script>
</body>
</html>
